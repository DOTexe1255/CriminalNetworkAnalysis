services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trace-postgres
    environment:
      POSTGRES_DB: trace
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
    volumes:
      - trace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U trace -d trace" ]
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    image: python:3.12-slim
    container_name: trace-storage
    command: [ "python", "-m", "http.server", "9000", "--directory", "/data" ]
    volumes:
      - trace_storage_data:/data
    ports:
      - "9002:9000"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/')\"" ]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    container_name: trace-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-tracepassword}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - trace_neo4j_data:/data
      - trace_neo4j_logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    env_file:
      - ./backend/.env
    build:
      context: ./backend
    container_name: trace-api
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-tracepassword}
      DATABASE_URL: postgresql://trace:trace@postgres:5432/trace
      HF_MODEL: ${HF_MODEL:-deepseek-ai/DeepSeek-V4-Flash-0731}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      USE_HF_EMBEDDINGS: ${USE_HF_EMBEDDINGS:-false}
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_ACCESS_KEY: traceadmin
      STORAGE_SECRET_KEY: tracepassword123
      STORAGE_BUCKET: trace-case-files
      STORAGE_ROOT: /app/storage
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - trace_storage_data:/app/storage
    ports:
      - "9000:8000"

  seed:
    env_file:
      - ./backend/.env
    build:
      context: ./backend
    container_name: trace-seed
    command: [ "python", "-m", "seed.seed_database" ]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-tracepassword}
      DATABASE_URL: postgresql://trace:trace@postgres:5432/trace
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      USE_HF_EMBEDDINGS: ${USE_HF_EMBEDDINGS:-false}
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_ACCESS_KEY: traceadmin
      STORAGE_SECRET_KEY: tracepassword123
      STORAGE_BUCKET: trace-case-files
      STORAGE_ROOT: /app/storage
    volumes:
      - trace_storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: trace-frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  trace_postgres_data:
  trace_neo4j_data:
  trace_neo4j_logs:
  trace_storage_data:
